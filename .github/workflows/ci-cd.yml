name: Acorn Legal Platform CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-Check & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static lint analysis
        run: npm run lint

      - name: Type-check with TypeScript compiler
        run: npx tsc --noEmit

  test:
    name: Automated Test Suite & Link Integrity
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite (crypto, statutory rules, access, lint)
        run: npm run test:unit

      - name: Build Next.js application
        run: npm run build

      - name: Run integration & workflow tests
        run: npm test

  build-container:
    name: Docker Containerization Build & Health Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: acorn-legal-platform:${{ github.sha }}, acorn-legal-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Staging Deployment (Synthetic Data Only)
    runs-on: ubuntu-latest
    needs: build-container
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Staging Deploy Dispatch
        run: |
          echo "Deploying release candidate ${{ github.sha }} to Staging Environment..."
          echo "Security Gate: Verified Section 16 POSH confidentiality & PII scrubbers active."
          echo "Health check target: /api/health"

